<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo 1: Geometric Motion - Clean, mathematical, suggests animation frames -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <!-- Three stacked planes suggesting depth/animation -->
  <rect x="45" y="85" width="70" height="70" rx="8" fill="#e94560" opacity="0.3" transform="rotate(-8 80 120)"/>
  <rect x="55" y="75" width="70" height="70" rx="8" fill="#e94560" opacity="0.6" transform="rotate(-4 90 110)"/>
  <rect x="65" y="65" width="70" height="70" rx="8" fill="#e94560"/>

  <!-- Mathematical curve overlay -->
  <path d="M75 90 Q100 70 125 90 Q150 110 125 130" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Play triangle suggesting animation -->
  <polygon points="92,95 92,115 108,105" fill="#1a1a2e"/>
</svg>