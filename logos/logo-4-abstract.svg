<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo 4: Abstract Mark - Mathematical curves forming an M -->
  <defs>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#0099ff"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="75" fill="#0a0a0f"/>

  <!-- Mathematical sine-like curves forming abstract M -->
  <path d="M40 130 Q55 50 85 100 Q100 140 100 100 Q100 60 115 100 Q145 150 160 70"
        stroke="url(#curveGrad)"
        stroke-width="6"
        fill="none"
        stroke-linecap="round"/>

  <!-- Coordinate dots -->
  <circle cx="40" cy="130" r="4" fill="#00d4aa"/>
  <circle cx="100" cy="100" r="5" fill="#00b8d4"/>
  <circle cx="160" cy="70" r="4" fill="#0099ff"/>
</svg>