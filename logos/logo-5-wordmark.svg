<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo 5: Full Wordmark with Icon -->
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Icon: Stylized animation frames -->
  <g transform="translate(20, 20)">
    <rect x="0" y="20" width="50" height="50" rx="6" fill="#6366f1" opacity="0.25" transform="rotate(-6 25 45)"/>
    <rect x="8" y="12" width="50" height="50" rx="6" fill="#6366f1" opacity="0.5" transform="rotate(-3 33 37)"/>
    <rect x="16" y="4" width="50" height="50" rx="6" fill="url(#brandGrad)"/>
    <polygon points="35,20 35,42 52,31" fill="white"/>
  </g>

  <!-- Wordmark -->
  <text x="110" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#0f172a" letter-spacing="-2">
    manimo
  </text>

  <!-- Subtle underline accent -->
  <rect x="112" y="88" width="80" height="3" rx="1.5" fill="url(#brandGrad)"/>
</svg>