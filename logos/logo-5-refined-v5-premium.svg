<svg width="440" height="120" viewBox="0 0 440 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Refined Wordmark v5: Premium, sophisticated with depth -->
  <defs>
    <linearGradient id="brandGradV5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:white;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:white;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Icon with layered depth -->
  <g transform="translate(20, 18)" filter="url(#dropShadow)">
    <!-- Stacked frames with precise offsets -->
    <rect x="0" y="16" width="56" height="56" rx="12" fill="#c4b5fd" opacity="0.4" transform="rotate(-8 28 44)"/>
    <rect x="6" y="10" width="56" height="56" rx="12" fill="#a78bfa" opacity="0.6" transform="rotate(-4 34 38)"/>

    <!-- Main frame with gradient -->
    <rect x="12" y="4" width="56" height="56" rx="12" fill="url(#brandGradV5)"/>

    <!-- Shine overlay -->
    <rect x="12" y="4" width="56" height="28" rx="12" fill="url(#shineGrad)"/>

    <!-- Play icon with subtle depth -->
    <g filter="url(#subtleShadow)">
      <path d="M34 18 L34 46 L56 32 Z" fill="white"/>
    </g>
  </g>

  <!-- Premium wordmark with refined spacing -->
  <g transform="translate(108, 32)" fill="#18181b">
    <!-- m -->
    <path d="M0 52 L0 18 L9 18 L9 24 C11 19 17 16 24 16 C31 16 36 19 39 24 C42 19 48 16 56 16 C67 16 74 23 74 35 L74 52 L65 52 L65 36 C65 29 61 25 54 25 C47 25 42 29 42 37 L42 52 L33 52 L33 36 C33 29 29 25 22 25 C15 25 10 29 10 37 L10 52 L0 52 Z"/>
    <!-- a -->
    <path d="M94 52 C87 52 83 48 83 42 C83 34 89 30 101 30 L112 30 L112 28 C112 23 108 20 101 20 C95 20 91 22 90 26 L81 24 C84 17 92 12 102 12 C116 12 123 19 123 30 L123 52 L114 52 L114 47 C111 51 106 54 99 54 C96 54 94 52 94 52 Z M101 46 C108 46 112 42 112 36 L112 35 L102 35 C95 35 91 37 91 41 C91 44 94 46 101 46 Z"/>
    <!-- n -->
    <path d="M136 52 L136 18 L145 18 L145 24 C148 19 154 16 161 16 C174 16 181 23 181 35 L181 52 L172 52 L172 36 C172 29 167 25 160 25 C152 25 146 29 146 37 L146 52 L136 52 Z"/>
    <!-- i with accent dot -->
    <path d="M196 52 L196 18 L207 18 L207 52 L196 52 Z"/>
    <circle cx="201.5" cy="6" r="6" fill="url(#brandGradV5)"/>
    <!-- m -->
    <path d="M222 52 L222 18 L231 18 L231 24 C233 19 239 16 246 16 C253 16 258 19 261 24 C264 19 270 16 278 16 C289 16 296 23 296 35 L296 52 L287 52 L287 36 C287 29 283 25 276 25 C269 25 264 29 264 37 L264 52 L255 52 L255 36 C255 29 251 25 244 25 C237 25 232 29 232 37 L232 52 L222 52 Z"/>
    <!-- o -->
    <path d="M318 54 C305 54 296 44 296 35 C296 25 305 16 318 16 C331 16 340 25 340 35 C340 44 331 54 318 54 Z M318 45 C326 45 331 40 331 35 C331 29 326 25 318 25 C310 25 305 29 305 35 C305 40 310 45 318 45 Z"/>
  </g>

  <!-- Tagline area - subtle -->
  <text x="108" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#71717a" letter-spacing="0.5">
    Mathematical animations made simple
  </text>
</svg>