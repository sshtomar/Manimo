# E2B Template Configuration for Manimo Notebooks

[template]
name = "manimo-notebook"
dockerfile = "e2b.Dockerfile"

# Memory and CPU allocation
memory_mb = 4096
cpu_count = 2

# Start command - keep container alive
start_cmd = "sleep infinity"

# Exposed ports
# 8080: Marimo notebook server
# 8081: AI server (internal, for Marimo AI integration)

[template.metadata]
description = "Manimo notebook environment with Marimo, Manim, and AI integration"
version = "1.0.0"
