[project]
name = "manimo-e2b"
version = "0.1.0"
description = "E2B sandbox infrastructure for Manimo notebooks"
requires-python = ">=3.11"
dependencies = [
    "e2b-code-interpreter>=0.15.0",
    "boto3>=1.34.0",
    "anthropic>=0.25.0",
    "openai>=1.12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manimo_e2b"]
