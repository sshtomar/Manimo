<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manimo Theme Palette</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: #0e0e10;
    color: #e0e0e0;
    padding: 48px 32px;
    line-height: 1.5;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    color: #fff;
  }

  .subtitle {
    color: #888;
    font-size: 15px;
    margin-bottom: 48px;
  }

  .section-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 24px;
    padding-bottom: 8px;
    border-bottom: 1px solid #1e1e22;
  }

  .themes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px;
    margin-bottom: 56px;
  }

  .theme-card {
    border: 1px solid #1e1e22;
    border-radius: 12px;
    overflow: hidden;
    background: #141416;
    transition: border-color 0.2s;
  }

  .theme-card:hover {
    border-color: #333;
  }

  .theme-card .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
    position: relative;
    top: -1px;
  }

  .badge.existing { background: #1e3a1e; color: #4ade80; }
  .badge.proposed { background: #3a2e1e; color: #fbbf24; }

  .theme-header {
    padding: 20px 20px 16px;
  }

  .theme-name {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }

  .theme-desc {
    font-size: 13px;
    color: #777;
  }

  /* The preview strip that simulates the actual scene */
  .scene-preview {
    margin: 0 20px;
    border-radius: 8px;
    height: 140px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene-preview .grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: repeat(6, 1fr);
  }

  .scene-preview .grid span {
    border-right: 1px solid;
    border-bottom: 1px solid;
  }

  .scene-preview .content {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .scene-preview .curve {
    width: 80px;
    height: 60px;
  }

  .scene-preview .label {
    font-size: 16px;
    font-weight: 600;
    font-family: 'Times New Roman', serif;
    font-style: italic;
  }

  /* Color swatches */
  .swatches {
    padding: 16px 20px 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .swatch {
    text-align: center;
  }

  .swatch-circle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    margin: 0 auto 4px;
    border: 2px solid #1e1e22;
    position: relative;
  }

  .swatch-circle.bg-swatch {
    border: 2px solid #444;
  }

  .swatch-label {
    font-size: 10px;
    color: #666;
    font-weight: 500;
  }

  .swatch-hex {
    font-size: 9px;
    color: #444;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }

  /* Typography & metrics row */
  .metrics {
    padding: 0 20px 16px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .metric {
    font-size: 11px;
    color: #555;
  }

  .metric strong {
    color: #888;
    font-weight: 600;
  }

  /* Side-by-side comparison section */
  .comparison {
    margin-bottom: 56px;
  }

  .comparison-row {
    display: flex;
    gap: 2px;
    margin-bottom: 2px;
    border-radius: 8px;
    overflow: hidden;
  }

  .comparison-cell {
    flex: 1;
    padding: 16px 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .comparison-label {
    width: 100px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 12px;
    font-size: 11px;
    color: #555;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: transparent !important;
  }

  /* Stroke thickness preview */
  .stroke-preview {
    padding: 12px 20px 20px;
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .stroke-line {
    flex: 1;
    border-radius: 2px;
  }

  .stroke-meta {
    font-size: 9px;
    color: #444;
    text-align: center;
    margin-top: 2px;
  }

  /* Font preview */
  .font-preview {
    padding: 0 20px 16px;
  }

  .font-preview span {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'Times New Roman', serif;
  }
</style>
</head>
<body>

<h1>Manimo Theme Palette</h1>
<p class="subtitle">Existing themes + proposed educator-focused themes. Each card shows a scene preview, color swatches, and typographic metrics.</p>

<!-- Existing Themes -->
<div class="section-label">Existing Themes</div>
<div class="themes-grid" id="existing"></div>

<!-- Proposed Themes -->
<div class="section-label">Proposed Educator Themes</div>
<div class="themes-grid" id="proposed"></div>

<!-- Side-by-side comparison -->
<div class="section-label">Side-by-Side Color Comparison</div>
<div class="comparison" id="comparison"></div>

<script>
const themes = [
  // ── Existing ──
  {
    name: "Classic", tag: "existing",
    desc: "Manim CE defaults, 3Blue1Brown-inspired",
    background: "#000000", foreground: "#FFFFFF", muted: "#888888",
    primary: "#58C4DD", secondary: "#FC6255", tertiary: "#83C167",
    accent: "#FFFF00", accent2: "#FF862F",
    sizes: [44, 36, 28, 24, 20],
    strokes: [2, 3, 5, 1],
    opacities: [0.3, 0.5, 0.15],
  },
  {
    name: "Dark Slate", tag: "existing",
    desc: "Tailwind slate palette, polished dark UI",
    background: "#0f172a", foreground: "#e2e8f0", muted: "#475569",
    primary: "#3b82f6", secondary: "#ef4444", tertiary: "#22c55e",
    accent: "#f59e0b", accent2: "#a855f7",
    sizes: [44, 36, 28, 24, 20],
    strokes: [2, 3, 5, 1],
    opacities: [0.3, 0.5, 0.15],
  },
  {
    name: "Light", tag: "existing",
    desc: "White background for presentations and print",
    background: "#FFFFFF", foreground: "#1e293b", muted: "#94a3b8",
    primary: "#2563eb", secondary: "#dc2626", tertiary: "#16a34a",
    accent: "#d97706", accent2: "#7c3aed",
    sizes: [44, 36, 28, 24, 20],
    strokes: [2, 3, 5, 1],
    opacities: [0.3, 0.5, 0.15],
  },
  {
    name: "Warm", tag: "existing",
    desc: "Deep purple tone, amber-pink-cyan palette",
    background: "#1a0a2e", foreground: "#fef3c7", muted: "#78716c",
    primary: "#f59e0b", secondary: "#ec4899", tertiary: "#06b6d4",
    accent: "#f97316", accent2: "#a78bfa",
    sizes: [44, 36, 28, 24, 20],
    strokes: [2, 3, 5, 1],
    opacities: [0.3, 0.5, 0.15],
  },

  // ── Proposed ──
  {
    name: "Chalkboard", tag: "proposed",
    desc: "Classroom chalkboard with chalk-pastel colors",
    background: "#2a3a2a", foreground: "#e8e0d0", muted: "#6b7b6b",
    primary: "#7eb8da", secondary: "#e8a0a0", tertiary: "#d4c878",
    accent: "#e8b060", accent2: "#78c8a0",
    sizes: [46, 38, 30, 26, 22],
    strokes: [2.5, 4, 6, 1.5],
    opacities: [0.2, 0.35, 0.1],
  },
  {
    name: "Whiteboard", tag: "proposed",
    desc: "Clean marker-on-whiteboard, high saturation",
    background: "#f8f6f0", foreground: "#1a1a2e", muted: "#b0aaa0",
    primary: "#1a73e8", secondary: "#d93025", tertiary: "#188038",
    accent: "#e8710a", accent2: "#8430ce",
    sizes: [44, 36, 28, 24, 20],
    strokes: [2, 3.5, 5.5, 1],
    opacities: [0.3, 0.5, 0.15],
  },
  {
    name: "High Contrast", tag: "proposed",
    desc: "WCAG AA+, color-blind safe blue/orange pair",
    background: "#000000", foreground: "#ffffff", muted: "#999999",
    primary: "#4da6ff", secondary: "#ff9933", tertiary: "#33cccc",
    accent: "#ffdd00", accent2: "#ff66cc",
    sizes: [48, 40, 32, 28, 24],
    strokes: [2.5, 4, 7, 1.5],
    opacities: [0.3, 0.5, 0.15],
  },
  {
    name: "Lecture Hall", tag: "proposed",
    desc: "Projector-optimized, high saturation, extra-large text",
    background: "#0a0e1a", foreground: "#f5f0e0", muted: "#4a5568",
    primary: "#38bdf8", secondary: "#fb7185", tertiary: "#a3e635",
    accent: "#fbbf24", accent2: "#c4b5fd",
    sizes: [50, 42, 34, 30, 26],
    strokes: [2.5, 4.5, 7, 1.5],
    opacities: [0.3, 0.5, 0.15],
  },
  {
    name: "Pastel", tag: "proposed",
    desc: "Soft Catppuccin-inspired, low fatigue for long sessions",
    background: "#1e1e2e", foreground: "#cdd6f4", muted: "#585b70",
    primary: "#89b4fa", secondary: "#fab387", tertiary: "#a6e3a1",
    accent: "#cba6f7", accent2: "#f5c2e7",
    sizes: [44, 36, 28, 24, 20],
    strokes: [2, 3, 5, 1],
    opacities: [0.35, 0.5, 0.15],
  },
];

const sizeLabels = ["title", "subtitle", "body", "label", "small"];
const strokeLabels = ["axis", "curve", "heavy", "fine"];
const roles = ["primary", "secondary", "tertiary", "accent", "accent2", "foreground", "muted", "background"];

function luminance(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const srgb = [r,g,b].map(c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4));
  return 0.2126*srgb[0] + 0.7152*srgb[1] + 0.0722*srgb[2];
}

function contrastRatio(c1, c2) {
  const l1 = luminance(c1), l2 = luminance(c2);
  const lighter = Math.max(l1,l2), darker = Math.min(l1,l2);
  return (lighter + 0.05) / (darker + 0.05);
}

function textColor(bg) {
  return luminance(bg) > 0.4 ? "#111" : "#eee";
}

function svgCurve(color, strokeWidth) {
  return `<svg viewBox="0 0 80 60" class="curve"><path d="M5 50 Q20 10 40 30 T75 15" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round"/></svg>`;
}

function buildCard(t) {
  const gridColor = t.muted + "30";
  const cr = contrastRatio(t.primary, t.background).toFixed(1);

  return `
    <div class="theme-card">
      <div class="theme-header">
        <div class="theme-name">${t.name} <span class="badge ${t.tag}">${t.tag}</span></div>
        <div class="theme-desc">${t.desc}</div>
      </div>

      <div class="scene-preview" style="background:${t.background}">
        <div class="grid" style="opacity:0.5">
          ${Array(72).fill(0).map(() => `<span style="border-color:${gridColor}"></span>`).join('')}
        </div>
        <div class="content">
          ${svgCurve(t.primary, t.strokes[1])}
          ${svgCurve(t.secondary, t.strokes[1])}
          <div>
            <div class="label" style="color:${t.foreground}">f(x)</div>
            <div class="label" style="color:${t.accent}; font-size:12px;">x = a</div>
          </div>
        </div>
      </div>

      <div class="metrics" style="margin-top:12px">
        <div class="metric"><strong>Contrast:</strong> ${cr}:1</div>
        <div class="metric"><strong>Sizes:</strong> ${t.sizes.join('/')}</div>
        <div class="metric"><strong>Strokes:</strong> ${t.strokes.join('/')}</div>
      </div>

      <div class="swatches">
        ${roles.map(role => {
          const hex = t[role];
          return `<div class="swatch">
            <div class="swatch-circle ${role === 'background' ? 'bg-swatch' : ''}" style="background:${hex}"></div>
            <div class="swatch-label">${role}</div>
            <div class="swatch-hex">${hex}</div>
          </div>`;
        }).join('')}
      </div>

      <div class="stroke-preview">
        ${t.strokes.map((sw, i) => `
          <div style="flex:1; text-align:center">
            <div class="stroke-line" style="height:${sw}px; background:${t.primary}"></div>
            <div class="stroke-meta">${strokeLabels[i]} ${sw}px</div>
          </div>
        `).join('')}
      </div>

      <div class="font-preview">
        ${t.sizes.map((s, i) => `
          <span style="font-size:${Math.round(s * 0.45)}px; color:${t.foreground}; opacity:${1 - i*0.15}">${sizeLabels[i]} ${s}pt</span>
        `).join('')}
      </div>
    </div>
  `;
}

// Render cards
document.getElementById('existing').innerHTML = themes.filter(t => t.tag === 'existing').map(buildCard).join('');
document.getElementById('proposed').innerHTML = themes.filter(t => t.tag === 'proposed').map(buildCard).join('');

// Render comparison strips
const compHTML = roles.map(role => {
  return `<div class="comparison-row">
    <div class="comparison-label">${role}</div>
    ${themes.map(t => {
      const hex = t[role];
      const fg = textColor(hex);
      return `<div class="comparison-cell" style="background:${hex}; color:${fg}" title="${t.name}: ${hex}">${hex}</div>`;
    }).join('')}
  </div>`;
}).join('');

const headerRow = `<div class="comparison-row">
  <div class="comparison-label"></div>
  ${themes.map(t => `<div class="comparison-cell" style="background:transparent; color:#888; font-size:11px; min-height:32px">${t.name}</div>`).join('')}
</div>`;

document.getElementById('comparison').innerHTML = headerRow + compHTML;
</script>
</body>
</html>
