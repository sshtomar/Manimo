[project]
name = "manimo-modal"
version = "0.1.0"
description = "Modal execution sandboxes for Manimo notebooks with Manim rendering"
requires-python = ">=3.11"
dependencies = [
    "modal>=0.62.0",
    "marimo>=0.17.8",
    "manim>=0.18.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
